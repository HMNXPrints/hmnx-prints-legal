# Erstellt bei jeder Aenderung an den Rechtstexten automatisch die PDFs im
# Ordner pdf/ und legt sie im Repository ab. Der "Stand" in der Fusszeile ist
# der Monat der letzten Aenderung der jeweiligen .md-Datei.
name: Rechtstexte als PDF

on:
  push:
    branches: [main]
    paths:
      - agb.md
      - datenschutz.md
      - impressum.md
      - tools/**
      - .github/workflows/rechtstexte-pdf.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: ReportLab installieren
        run: pip install reportlab==4.2.5

      - name: PDFs erstellen
        run: |
          stand() { git log -1 --format=%cd --date=format:%m/%Y -- "$1"; }
          footer="HMNX.Prints · Stephan Peter · Stand:"
          python tools/markdown_zu_pdf.py agb.md -o pdf/AGB-und-Widerrufsbelehrung.pdf --footer "$footer $(stand agb.md)"
          python tools/markdown_zu_pdf.py datenschutz.md -o pdf/Datenschutzhinweise.pdf --footer "$footer $(stand datenschutz.md)" --no-section-page-breaks
          python tools/markdown_zu_pdf.py impressum.md -o pdf/Impressum.pdf --footer "$footer $(stand impressum.md)" --no-section-page-breaks

      - name: PDFs im Repository ablegen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add pdf
          if git diff --cached --quiet; then
            echo "PDFs unveraendert."
          else
            git commit -m "PDFs aus den Rechtstexten erstellt"
            git push
          fi
